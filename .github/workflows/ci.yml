name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, typecheck, unit, lint, build, drift, audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendary
          POSTGRES_PASSWORD: vendary
          POSTGRES_DB: vendary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendary -d vendary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Service-container credentials are local to the job; never real secrets.
      DATABASE_URL: postgresql://vendary:vendary@localhost:5432/vendary
      SHADOW_DATABASE_URL: postgresql://vendary:vendary@localhost:5432/vendary_shadow
      AUTH_SECRET: ci-placeholder-secret-that-is-at-least-32-chars
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-key-secret
      RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Create shadow database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vendary_shadow;'

      - name: Migration drift check
        # Exit code 2 means the migrations no longer produce schema.prisma.
        run: |
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Dependency audit (high/critical triage, non-blocking)
        continue-on-error: true
        run: bun audit --audit-level=high

  e2e:
    name: E2E (browse/cart/checkout subset)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendary
          POSTGRES_PASSWORD: vendary
          POSTGRES_DB: vendary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendary -d vendary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vendary:vendary@localhost:5432/vendary
      AUTH_SECRET: ci-placeholder-secret-that-is-at-least-32-chars
      # No real Razorpay keys in CI: the @payment spec is excluded by grep and
      # the app still needs syntactically valid placeholders at startup.
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-key-secret
      RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('app/**', 'modules/**', 'lib/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Seed demo catalog
        run: bun run db:seed

      - name: Run e2e (non-payment)
        run: npm run e2e -- --grep-invert @payment

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
